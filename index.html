<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オンラインUNO</title>
<style>
:root{
  --bg:#0f1b2d; --bg2:#16294a; --panel:#1d3157; --line:#33497a; --text:#f3f6ff; --muted:#9db0d6;
  --r:#e5484d; --y:#f5c518; --g:#2fa84f; --b:#2f7de1; --accent:#ffd447;
  --cw:74px; --ch:110px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 35%,var(--bg2),var(--bg) 70%) fixed;
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:disabled{cursor:default}
#app{min-height:100%;display:flex;flex-direction:column}

/* ---------- home / lobby ---------- */
.panel{width:min(420px,calc(100% - 32px));margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:44px;font-weight:900;letter-spacing:.04em;text-align:center;margin:0 0 4px;font-style:italic}
.logo span:nth-child(1){color:var(--r)}.logo span:nth-child(2){color:var(--y)}.logo span:nth-child(3){color:var(--g)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1d38;color:var(--text);font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:16px;background:var(--accent);color:#1b1b1b;margin-top:14px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.45;filter:none}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:20px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:rgba(229,72,77,.15);border:1px solid var(--r);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.code{font-size:40px;font-weight:900;letter-spacing:.22em;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.plist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;background:#0f1d38;border-radius:10px;padding:10px 12px;font-weight:600}
.plist .tag{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);flex:none}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:16px 0 0}
.rules{margin:16px 0 0;display:grid;gap:6px;text-align:left}
.rules h3{font-size:12px;color:var(--muted);margin:0;font-weight:400}
.rules label,.rules .ro{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:13px;color:var(--text);background:#0f1d38;border-radius:10px;padding:9px 10px}
.rules label{cursor:pointer}
.rules input{width:auto;padding:0;margin:3px 0 0;accent-color:var(--accent);flex:none}
.rules .ro.off{color:var(--muted);text-decoration:line-through}

/* ---------- table ---------- */
.table{flex:1;display:flex;flex-direction:column;min-height:100dvh;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.top b{color:var(--text);letter-spacing:.12em}
.top .leave{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted)}
.arena{flex:1;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;grid-template-areas:"l t r" "l c r";gap:8px;margin-top:10px}
.seatL{grid-area:l;align-self:center}.seatR{grid-area:r;align-self:center}
.seatT{grid-area:t;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.opp{position:relative;background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:14px;padding:8px 12px;min-width:112px;text-align:center;transition:border-color .2s,background .2s}
.opp.active{border-color:var(--accent);background:rgba(255,212,71,.1);animation:glow 1.1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 24px rgba(255,212,71,.55)}}
.opp.off{opacity:.5}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin:0 auto 4px;font-weight:900;color:#fff;font-size:16px}
.opp .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;margin:0 auto}
.opp .cnt{font-size:12px;color:var(--muted);margin-top:2px}
.opp.active .cnt{color:var(--accent)}
.backs{display:flex;justify-content:center;height:34px;margin-top:6px}
.backs i{width:22px;height:32px;border-radius:4px;background:#111;border:2px solid #fff;margin-left:-14px;box-shadow:0 1px 3px rgba(0,0,0,.4);position:relative}
.backs i:first-child{margin-left:0}
.backs i::after{content:"";position:absolute;inset:5px 2px;border-radius:50%;background:var(--r);transform:rotate(-20deg)}
.badge{display:inline-block;background:var(--r);color:#fff;font-weight:900;font-size:11px;border-radius:6px;padding:2px 6px;margin-top:5px;font-style:italic}
.catch{display:block;margin:6px auto 0;background:var(--accent);color:#1b1b1b;font-weight:800;font-size:11px;border-radius:8px;padding:5px 8px;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.bubble{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:12px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.bubble.emote{font-size:28px;padding:2px 8px}
.bubble.mine{position:static;transform:none}
.bubble.fresh{animation:pop .25s ease-out}
@keyframes pop{from{scale:.4;opacity:0}}

.center{grid-area:c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:200px}
.pend{font-size:30px;font-weight:900;color:var(--r);font-style:italic;text-shadow:0 0 14px rgba(229,72,77,.7);animation:pulse .6s infinite alternate;height:36px;line-height:36px}
.piles{display:flex;align-items:center;gap:22px}
.deck{position:relative;width:var(--cw);height:var(--ch);border-radius:10px;background:#111;border:4px solid #fff;box-shadow:3px 3px 0 #ddd,6px 6px 0 #bbb,0 10px 24px rgba(0,0,0,.4);transition:transform .12s}
.deck::after{content:"UNO";position:absolute;inset:18% 6%;border-radius:50%;background:var(--r);transform:rotate(-24deg);display:grid;place-items:center;color:var(--y);font-weight:900;font-style:italic;font-size:calc(var(--cw)*.26)}
.deck.can{outline:3px solid var(--accent);outline-offset:4px}
.deck.can:hover{transform:translateY(-4px)}
.deck small{position:absolute;bottom:-32px;left:-20px;right:-20px;white-space:nowrap;text-align:center;font-size:11px;color:var(--muted)}
.flycard{position:fixed;width:var(--cw);height:var(--ch);border-radius:10px;background:#111;border:4px solid #fff;z-index:40;pointer-events:none}
.discard{position:relative;padding:8px;border-radius:18px;transition:box-shadow .25s,background .25s}
.discard.col-r{background:rgba(229,72,77,.25);box-shadow:0 0 0 3px var(--r),0 0 40px rgba(229,72,77,.5)}
.discard.col-y{background:rgba(245,197,24,.2);box-shadow:0 0 0 3px var(--y),0 0 40px rgba(245,197,24,.45)}
.discard.col-g{background:rgba(47,168,79,.25);box-shadow:0 0 0 3px var(--g),0 0 40px rgba(47,168,79,.5)}
.discard.col-b{background:rgba(47,125,225,.25);box-shadow:0 0 0 3px var(--b),0 0 40px rgba(47,125,225,.5)}
.dir{font-size:26px;color:var(--muted);width:30px;text-align:center}
.log{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;min-height:58px;margin-top:18px}
.log div:last-child{color:var(--text);font-size:13px}

.me{margin-top:6px;position:sticky;bottom:0;z-index:7;background:linear-gradient(to bottom,transparent,var(--bg) 26px)}
.mebar{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;flex-wrap:wrap}
.turn{font-weight:800;font-size:15px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.07);text-align:center}
.turn.mine{background:var(--accent);color:#1b1b1b}
.act{padding:9px 16px;border-radius:999px;font-weight:800;font-size:14px;background:#fff;color:#1b1b1b}
.act.sub{background:transparent;border:1px solid var(--line);color:var(--text)}
.act.uno{background:var(--r);color:#fff;font-style:italic;letter-spacing:.05em}
.act.uno.said{background:transparent;border:2px solid var(--r);color:var(--r)}
.hand{display:flex;justify-content:center;padding:30px 4px 6px;--ov:6px}
.hand .card{flex:none;margin-left:var(--ov);transition:transform .12s,filter .15s}
.hand .card:first-child{margin-left:0}
.hand .card.ok{transform:translateY(-12px)}
.hand .card.ok:hover{transform:translateY(-22px);z-index:5}
.hand .card.no{filter:brightness(.5) saturate(.7)}
.hand .card.new{outline:3px solid var(--accent);outline-offset:2px}
.hand .card.sel{transform:translateY(-26px);outline:3px solid var(--accent);outline-offset:2px;z-index:4}
.emotes{display:flex;justify-content:center;gap:6px;margin-top:6px}
.emotes button{background:rgba(255,255,255,.07);border-radius:999px;width:40px;height:32px;font-size:17px}

/* ---------- card ---------- */
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:10px;border:4px solid #fff;padding:0;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35);overflow:hidden;display:block;font-weight:900;font-style:italic}
.c-r{background:var(--r)}.c-y{background:var(--y)}.c-g{background:var(--g)}.c-b{background:var(--b)}.c-w{background:#151515}
.card .co{position:absolute;font-size:calc(var(--cw)*.2);line-height:1;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.card .tl{top:5px;left:6px}.card .br{bottom:5px;right:6px;transform:rotate(180deg)}
.card .ov{position:absolute;inset:16% 8%;border-radius:50%;background:#fff;transform:rotate(-24deg);display:grid;place-items:center}
.card .bg{transform:rotate(24deg);font-size:calc(var(--cw)*.5);line-height:1;-webkit-text-stroke:1px rgba(0,0,0,.25)}
.c-r .bg{color:var(--r)}.c-y .bg{color:var(--y)}.c-g .bg{color:var(--g)}.c-b .bg{color:var(--b)}
.c-w .ov{background:conic-gradient(var(--r) 0 25%,var(--b) 0 50%,var(--g) 0 75%,var(--y) 0)}
.c-w .bg{color:#fff;-webkit-text-stroke:0;text-shadow:0 0 4px #000,1px 1px 0 #000;font-size:calc(var(--cw)*.36)}
.u69{text-decoration:underline}

/* ---------- overlays ---------- */
.modal{position:fixed;inset:0;background:rgba(5,10,22,.72);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(380px,100%);text-align:center}
.modal h2{margin:0 0 16px;font-size:20px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{height:84px;border-radius:14px;font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.score{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:6px;text-align:left}
.score li{display:flex;justify-content:space-between;background:#0f1d38;border-radius:10px;padding:9px 12px;font-size:14px}
.banner{position:fixed;top:0;left:0;right:0;background:var(--r);color:#fff;text-align:center;font-size:13px;padding:6px;z-index:60}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:70;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- effects ---------- */
#stage{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.floatemo{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;will-change:transform,opacity;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.floatemo small{margin-top:4px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 8px;white-space:nowrap}
.bigplay{position:absolute;left:50%;top:44%;--cw:128px;--ch:192px}
.bp-row{position:relative;width:0;height:0}
.bp-row .card{position:absolute;left:calc(var(--cw)/-2);top:calc(var(--ch)/-2);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.bp-cap{position:absolute;left:50%;top:calc(var(--ch)/2 + 22px);transform:translateX(-50%);white-space:nowrap;background:rgba(10,18,36,.82);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:800;font-size:16px}
.bp-cap i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.biguno{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;font-style:italic;font-weight:900;line-height:1;white-space:nowrap}
.biguno .w{display:block;font-size:clamp(90px,26vw,260px);letter-spacing:.03em;-webkit-text-stroke:6px #fff;paint-order:stroke fill;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.biguno .w span:nth-child(1){color:var(--r)}.biguno .w span:nth-child(2){color:var(--y)}.biguno .w span:nth-child(3){color:var(--g)}.biguno .w span:nth-child(4){color:var(--b)}
.biguno .w.f{font-size:clamp(60px,15vw,160px);color:#fff;-webkit-text-stroke:0;text-shadow:0 6px 0 var(--r),0 12px 40px rgba(0,0,0,.6)}
.biguno .who{display:inline-block;margin-top:10px;background:rgba(10,18,36,.82);border:1px solid var(--line);border-radius:999px;padding:8px 20px;font-size:18px;font-style:normal}
@media (max-width:640px){ .bigplay{--cw:96px;--ch:144px} }
@media (max-height:760px){
  :root{--cw:64px;--ch:96px}
  .center{min-height:120px}
  .log{min-height:40px;margin-top:8px}
}
@media (max-width:640px){
  :root{--cw:58px;--ch:88px}
  .arena{grid-template-areas:"l t r" "c c c"}
  .seatL,.seatR{align-self:end;margin-top:34px}
  .opp{min-width:88px;padding:6px 8px}
  .piles{gap:14px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="stage"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';

/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const COLORS = ['r','y','g','b'];
const COLOR_NAME = {r:'赤',y:'黄',g:'緑',b:'青'};
const PREFIX = 'uno-friends-room-v1-';
const MAX_PLAYERS = 8;
const RULES = [
  ['multi','同じ数字・記号をまとめて出せる（2枚出し）'],
  ['stack','ドローを重ねて返せる（+2には+2か+4、+4には+4）'],
  ['noSymbolEnd','記号カードではあがれない（数字であがる）'],
  ['shuffle','シャッフルワイルドを入れる（全員の手札を集めて配り直す）'],
];
const DEFAULT_RULES = {multi:true,stack:true,noSymbolEnd:true,shuffle:false};
const EMOTES = ['😆','😭','😡','👏','🤔'];
const AV_COLORS = ['#e5484d','#2f7de1','#2fa84f','#c08a00','#8e4ec6','#d6409f','#12a594','#f76b15'];
const rand = n => Math.floor(Math.random()*n);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const makeCode = () => { const cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=cs[rand(cs.length)]; return s; };
const store = {
  get(st,k){ try{ return st.getItem(k); }catch{ return null; } },
  set(st,k,v){ try{ st.setItem(k,v); }catch{} },
  del(st,k){ try{ st.removeItem(k); }catch{} },
};
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

/* ================= session ================= */
let myPid = store.get(sessionStorage,'uno-pid');
if(!myPid){ myPid = uid(); store.set(sessionStorage,'uno-pid',myPid); }
let myName = store.get(localStorage,'uno-name') || '';
let role = null;            // 'host' | 'guest'
let peer = null, hostConn = null, code = null;
let G = null;               // host only: authoritative game state
const conns = new Map();    // host only: pid -> connection
let view = null;            // what this player sees
const bubTs = {};
const ui = { screen:'home', error:'', picking:null, sel:[], bubbles:{}, reconnecting:false };
let autoT, retryT, lastFx, lastSig, seenView = false, wasMine = false, everConnected = false;

/* ================= game rules (shared) ================= */
const isNum = c => /^\d$/.test(c.v);
function cardName(c){
  if(c.v==='wild') return 'ワイルド';
  if(c.v==='d4') return 'ワイルド ドロー4';
  if(c.v==='sh') return 'シャッフルワイルド';
  return COLOR_NAME[c.c]+'の'+({skip:'スキップ',rev:'リバース',d2:'ドロー2'}[c.v]||c.v);
}
function canPlay(card, top, color){ return card.c==='w' || card.c===color || (top && card.v===top.v); }
// s: {top,color,drawn,pending,rules} — may this card be the first card of a play?
function playable(card, s){
  if(s.drawn!=null && s.drawn!==card.id) return false;
  if(s.pending>0) return s.rules.stack && (card.v==='d4' || (card.v==='d2' && s.top && s.top.v==='d2'));
  return canPlay(card, s.top, s.color);
}

/* ================= game rules (host side) ================= */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newDeck(){
  const d=[]; let id=0;
  for(const c of COLORS){
    d.push({id:id++,c,v:'0'});
    for(let k=0;k<2;k++){
      for(let n=1;n<=9;n++) d.push({id:id++,c,v:String(n)});
      for(const v of ['skip','rev','d2']) d.push({id:id++,c,v});
    }
  }
  for(let k=0;k<4;k++){ d.push({id:id++,c:'w',v:'wild'}); d.push({id:id++,c:'w',v:'d4'}); }
  if(G.rules.shuffle) for(let k=0;k<2;k++) d.push({id:id++,c:'w',v:'sh'});
  return shuffle(d);
}
function addLog(s){ G.log.push(s); if(G.log.length>30) G.log.shift(); }
function setFx(pid,text,kind,n,extra){ G.fx=Object.assign({seq:((G.fx&&G.fx.seq)||0)+1,pid,text,kind,n:n||0},extra||{}); }
function nextIdx(steps){ const n=G.players.length; return (((G.turn + G.dir*steps) % n) + n) % n; }
function drawCards(p,n){
  let got=0;
  for(let i=0;i<n;i++){
    if(!G.deck.length){
      if(G.discard.length<=1) break;
      const top=G.discard.pop(); G.deck=shuffle(G.discard); G.discard=[top];
    }
    p.hand.push(G.deck.pop()); got++;
  }
  if(p.hand.length!==1) p.calledUno=false;
  return got;
}
function shuffleHands(){
  const all=[], n=G.players.length;
  for(const q of G.players){ all.push(...q.hand); q.hand=[]; }
  shuffle(all);
  let idx=G.turn;
  for(const c of all){ idx=(((idx+G.dir)%n)+n)%n; G.players[idx].hand.push(c); }
  for(const q of G.players) q.calledUno = q.hand.length===1;
}
function startRound(){
  G.players = G.players.filter(p=>p.online);
  if(G.players.length<2){ G.phase='lobby'; return; }
  G.deck=newDeck(); G.discard=[];
  for(const p of G.players){ p.hand=[]; p.calledUno=false; }
  for(const p of G.players) drawCards(p,7);
  let i=G.deck.length-1; while(!isNum(G.deck[i])) i--;
  const first=G.deck.splice(i,1)[0];
  G.discard.push(first); G.color=first.c;
  G.turn=rand(G.players.length); G.dir=1; G.drawn=null; G.pending=0; G.winner=null; G.phase='playing';
  G.log=[]; addLog('ゲーム開始！ '+G.players[G.turn].name+' から');
}
// UNO forgotten: the 2nd time onward gets the 忘れん坊 treatment
function forgetFx(t,skipped){
  t.forgot=(t.forgot||0)+1;
  if(t.forgot>=2){ addLog('😡🫵 '+t.name+'「忘れん坊！」（'+t.forgot+'回目）'); setFx(t.pid,'忘れん坊！😡🫵 +2','forgot',2); }
  else setFx(t.pid,skipped?'言い忘れ！ +2＆スキップ':'言い忘れ！ +2','draw',2);
}
// nobody called it out: when the turn comes back to a player still on 1 card without UNO, they auto-draw 2 and lose the turn
function autoPenalty(){
  for(let i=0;i<G.players.length;i++){
    if(G.phase!=='playing' || G.drawn!=null) return;
    const t=G.players[G.turn];
    if(t.hand.length!==1 || t.calledUno) return;
    drawCards(t,G.pending>0 ? G.pending+2 : 2); G.pending=0;
    addLog('⏭ '+t.name+' はUNOを言い忘れたまま番が来たので2枚引いてスキップ');
    forgetFx(t,true);
    G.turn=nextIdx(1);
  }
}
function handleAction(pid,a){
  const p=G.players.find(x=>x.pid===pid); if(!p||!a) return;
  const n=G.players.length;
  const cur=G.phase==='playing' ? G.players[G.turn] : null;
  switch(a.type){
    case 'start':
      if(pid!==G.hostPid || G.phase==='playing') return;
      startRound(); break;
    case 'rule':
      if(pid!==G.hostPid || G.phase==='playing' || !(a.key in DEFAULT_RULES)) return;
      G.rules[a.key]=!!a.val; break;
    case 'play': {
      if(cur!==p) return;
      const ids=Array.isArray(a.ids)?a.ids:[];
      if(!ids.length || new Set(ids).size!==ids.length) return;
      const cards=ids.map(id=>p.hand.find(c=>c.id===id)); if(cards.some(c=>!c)) return;
      const first=cards[0], last=cards[cards.length-1], k=cards.length;
      if(k>1 && (!G.rules.multi || cards.some(c=>c.v!==first.v))) return;
      if(!playable(first,{top:G.discard[G.discard.length-1],color:G.color,drawn:G.drawn,pending:G.pending,rules:G.rules})) return;
      if(first.c==='w' && !COLORS.includes(a.color)) return;
      if(G.rules.noSymbolEnd && k===p.hand.length && !isNum(first)) return;
      if(k===p.hand.length && p.hand.length<=2 && !p.calledUno){ setFx(pid,'UNOを言ってから！','say'); return; }
      p.hand=p.hand.filter(c=>!ids.includes(c.id)); G.discard.push(...cards);
      G.color = last.c==='w' ? a.color : last.c; G.drawn=null;
      if(p.hand.length!==1) p.calledUno=false;
      addLog(p.name+' が '+cardName(last)+' を'+(k>1?k+'枚':'')+'出した'+(last.c==='w' ? '（'+COLOR_NAME[G.color]+'を指定）' : ''));
      // with "no going out on a symbol card", being left with only a symbol card is a dead end: draw 2 automatically
      const stuck = G.rules.noSymbolEnd && p.hand.length===1 && !isNum(p.hand[0]);
      if(stuck){ drawCards(p,2); addLog('🃏 '+p.name+' は記号カードだけ残ったので2枚引いた'); }
      setFx(pid,cardName(last)+(k>1?' ×'+k:'')+(stuck?'　記号だけ残って+2':''),'play',k,{cards:cards.map(c=>({c:c.c,v:c.v})),col:G.color});
      if(!p.hand.length){ G.phase='ended'; G.winner=pid; p.wins++; addLog('🎉 '+p.name+' の勝ち！'); break; }
      let steps=1;
      if(first.v==='skip'){ steps=n===2?2:1+k; addLog(k>1 ? k+'人分スキップ' : G.players[nextIdx(1)].name+' はスキップ'); }
      else if(first.v==='rev'){ if(n>2 && k%2) G.dir*=-1; }
      else if(first.v==='d2'||first.v==='d4'){
        const amt=k*(first.v==='d2'?2:4);
        if(G.rules.stack){ G.pending+=amt; addLog('ドロー合計 +'+G.pending+' → '+G.players[nextIdx(1)].name); }
        else{ const t=G.players[nextIdx(1)]; drawCards(t,amt); steps=2; addLog(t.name+' は'+amt+'枚引いてスキップ'); }
      }
      else if(first.v==='sh'){ shuffleHands(); addLog('🔀 全員の手札を集めて配り直した'); }
      G.turn=nextIdx(steps);
      break;
    }
    case 'draw': {
      if(cur!==p || G.drawn!=null) return;
      if(G.pending>0){
        const k=drawCards(p,G.pending);
        addLog(p.name+' は'+k+'枚引いた'); setFx(pid,k+'枚引いた…','draw',k);
        G.pending=0; G.turn=nextIdx(1); break;
      }
      const before=p.hand.length;
      drawCards(p,1);
      const card = p.hand.length>before ? p.hand[p.hand.length-1] : null;
      addLog(p.name+' がカードを引いた'); setFx(pid,'1枚引いた','draw',1);
      if(card && canPlay(card, G.discard[G.discard.length-1], G.color)) G.drawn=card.id;
      else G.turn=nextIdx(1);
      break;
    }
    case 'pass':
      if(cur!==p || G.drawn==null) return;
      G.drawn=null; G.turn=nextIdx(1); addLog(p.name+' はパス'); setFx(pid,'パス','say');
      break;
    case 'uno':
      if(G.phase!=='playing' || p.calledUno) return;
      if(p.hand.length===1 || (p.hand.length===2 && cur===p)){ p.calledUno=true; addLog('📣 '+p.name+'「UNO！」'); setFx(pid,'UNO！','say'); }
      break;
    case 'catch': {
      if(G.phase!=='playing') return;
      const t=G.players.find(x=>x.pid===a.target);
      if(!t || t===p || t.hand.length!==1 || t.calledUno) return;
      drawCards(t,2); addLog('👉 '+p.name+' が指摘！ '+t.name+' はUNOを言い忘れて2枚引いた'); forgetFx(t,false);
      break;
    }
    case 'emote':
      if(!EMOTES.includes(a.e)) return;
      setFx(pid,a.e,'emote'); break;
  }
  if(a.type==='play' || a.type==='draw' || a.type==='pass') autoPenalty();
}
function viewFor(pid){
  const me=G.players.find(p=>p.pid===pid);
  const order={r:0,y:1,g:2,b:3,w:4};
  const hand = me ? me.hand.slice().sort((a,b)=> order[a.c]-order[b.c] || (a.v<b.v?-1:a.v>b.v?1:0)) : [];
  const cur = G.phase==='playing' ? G.players[G.turn] : null;
  return {
    code, phase:G.phase, you:pid, hostPid:G.hostPid, rules:G.rules,
    players:G.players.map(p=>({pid:p.pid,name:p.name,count:p.hand.length,online:p.online,calledUno:p.calledUno,wins:p.wins})),
    hand, top:G.discard[G.discard.length-1]||null, color:G.color, turn:cur?cur.pid:null, dir:G.dir,
    drawn: cur && cur.pid===pid ? G.drawn : null, pending:G.pending||0,
    deckCount:G.deck.length, winner:G.winner, log:G.log.slice(-4), fx:G.fx||null,
  };
}
function broadcast(){
  for(const p of G.players){
    if(p.pid===myPid) view=viewFor(p.pid);
    else { const c=conns.get(p.pid); if(c && c.open) c.send({t:'state',s:viewFor(p.pid)}); }
  }
  store.set(sessionStorage,'uno-host',JSON.stringify({code,G}));
  render();
  // players who dropped out get their turn auto-played so the game never stalls
  clearTimeout(autoT);
  if(G.phase==='playing' && !G.players[G.turn].online){
    autoT=setTimeout(()=>{
      if(G.phase!=='playing') return;
      const cur=G.players[G.turn]; if(cur.online) return;
      handleAction(cur.pid,{type:'draw'});
      if(G.drawn!=null && G.players[G.turn]===cur) handleAction(cur.pid,{type:'pass'});
      broadcast();
    },2500);
  }
}

/* ================= networking ================= */
function onGuestConn(conn){
  conn.on('data',m=>{
    if(!m || typeof m!=='object') return;
    if(m.t==='join'){
      const pid=String(m.pid||'').replace(/[^a-z0-9]/gi,'').slice(0,20); if(!pid || pid===myPid) return;
      const name=String(m.name||'').trim().slice(0,12)||'ゲスト';
      let p=G.players.find(x=>x.pid===pid);
      if(p){
        p.online=true; p.name=name;
        const old=conns.get(pid); if(old && old!==conn){ conns.delete(pid); old.close(); }
      }else{
        if(G.phase==='playing'){ conn.send({t:'error',msg:'ゲームが進行中のため参加できません。終わるまでお待ちください。'}); return; }
        if(G.players.length>=MAX_PLAYERS){ conn.send({t:'error',msg:'このルームは満員です（最大'+MAX_PLAYERS+'人）。'}); return; }
        G.players.push({pid,name,hand:[],online:true,calledUno:false,wins:0});
      }
      conn.pid=pid; conns.set(pid,conn); broadcast();
    }else if(m.t==='action' && conn.pid && conns.get(conn.pid)===conn){
      handleAction(conn.pid,m.a); broadcast();
    }
  });
  const gone=()=>{
    if(!conn.pid || conns.get(conn.pid)!==conn) return;
    conns.delete(conn.pid);
    const i=G.players.findIndex(x=>x.pid===conn.pid); if(i<0) return;
    if(G.phase==='lobby') G.players.splice(i,1); else G.players[i].online=false;
    broadcast();
  };
  conn.on('close',gone); conn.on('error',gone);
}
function openHost(resume,tries=0){
  role='host';
  peer=new Peer(PREFIX+code);
  peer.on('open',()=>{
    ui.screen='game'; ui.error='';
    history.replaceState(null,'','?room='+code);
    broadcast();
  });
  peer.on('connection',onGuestConn);
  peer.on('disconnected',()=>{ if(peer && !peer.destroyed) peer.reconnect(); });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      peer.destroy();
      if(!resume){ code=makeCode(); openHost(false); }
      else if(tries<8) setTimeout(()=>openHost(true,tries+1),1500);
      else goHome('ルームを再開できませんでした。');
    }else if(ui.screen==='connecting'){ goHome('サーバーに接続できませんでした。通信環境を確認してください。'); }
  });
}
function createRoom(){
  code=makeCode();
  G={hostPid:myPid,phase:'lobby',rules:{...DEFAULT_RULES},players:[{pid:myPid,name:myName,hand:[],online:true,calledUno:false,wins:0}],
     deck:[],discard:[],color:null,turn:0,dir:1,drawn:null,pending:0,winner:null,log:[],fx:null};
  ui.screen='connecting'; render();
  openHost(false);
}
function joinRoom(c){
  role='guest'; code=c; everConnected=false;
  ui.screen='connecting'; render();
  peer=new Peer();
  peer.on('open',connectHost);
  peer.on('disconnected',()=>{ if(peer && !peer.destroyed) peer.reconnect(); });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){
      if(everConnected) scheduleRetry();
      else goHome('ルーム「'+code+'」が見つかりません。コードを確認してください。');
    }else if(!everConnected){ goHome('サーバーに接続できませんでした。通信環境を確認してください。'); }
  });
}
function scheduleRetry(){
  ui.reconnecting=true; render();
  clearTimeout(retryT); retryT=setTimeout(connectHost,2000);
}
function connectHost(){
  if(!peer || peer.destroyed) return;
  if(peer.disconnected){ scheduleRetry(); return; }
  const conn=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});
  hostConn=conn;
  conn.on('open',()=>{ conn.send({t:'join',pid:myPid,name:myName}); });
  conn.on('data',m=>{
    if(m.t==='state'){
      everConnected=true; ui.reconnecting=false; ui.screen='game'; view=m.s;
      store.set(sessionStorage,'uno-guest',code);
      history.replaceState(null,'','?room='+code);
      if(view.turn!==view.you) ui.picking=null;
      render();
    }else if(m.t==='error'){ goHome(m.msg); }
  });
  conn.on('close',()=>{ if(hostConn===conn && role==='guest') scheduleRetry(); });
}
function goHome(msg){
  clearTimeout(retryT); clearTimeout(autoT); Object.values(bubTs).forEach(clearTimeout);
  role=null; view=null; G=null; conns.clear(); seenView=false; lastSig=null;
  if(peer){ try{ peer.destroy(); }catch{} peer=null; }
  store.del(sessionStorage,'uno-host'); store.del(sessionStorage,'uno-guest');
  ui.screen='home'; ui.error=msg||''; ui.picking=null; ui.sel=[]; ui.bubbles={}; ui.reconnecting=false;
  render();
}
function act(a){
  if(role==='host'){ handleAction(myPid,a); broadcast(); }
  else if(hostConn && hostConn.open) hostConn.send({t:'action',a});
}
addEventListener('pagehide',()=>{ try{ if(peer) peer.destroy(); }catch{} });

function cardHTML(c,cls,attrs){
  const label=({skip:'⊘',rev:'⇄',d2:'+2',wild:'W',d4:'+4',sh:'🔀'})[c.v]||c.v;
  const u = (c.v==='6'||c.v==='9') ? ' u69' : '';
  return `<button class="card c-${c.c} ${cls||''}" ${attrs||''} aria-label="${esc(cardName(c))}">`+
    `<span class="co tl${u}">${label}</span><span class="ov"><span class="bg${u}">${label}</span></span><span class="co br${u}">${label}</span></button>`;
}
function rulesHTML(editable){

  return `<div class="rules"><h3>ルール設定${editable?'':'（ホストが変更できます）'}</h3>${RULES.map(([k,t])=> editable
    ? `<label><input type="checkbox" data-act="rule" data-k="${k}" ${r[k]?'checked':''}><span>${t}</span></label>`

function renderTable(){
  const v=view, rules=v.rules||DEFAULT_RULES;
  const meIdx=v.players.findIndex(p=>p.pid===v.you), me=v.players[meIdx];
  const myTurn=v.turn===v.you && v.phase==='playing';
  const turnP=v.players.find(p=>p.pid===v.turn);
  if(!myTurn) ui.sel=[];
  ui.sel=ui.sel.filter(id=>v.hand.some(c=>c.id===id));

  // seats go clockwise from me: left, top (left→right), right

  let L=[],T=[],R=[]; const n=opps.length;
  if(n===1) T=opps; else if(n===2){ L=[opps[0]]; R=[opps[1]]; } else if(n>2){ L=[opps[0]]; R=[opps[n-1]]; T=opps.slice(1,n-1); }

      <div class="cnt">${active?'考え中… ':''}${p.count}枚</div>

      ${bubbleHTML(p.pid,false)}

  };

  const selCard=ui.sel.length ? v.hand.find(c=>c.id===ui.sel[0]) : null;

  const canDraw = myTurn && v.drawn==null;
  let turnText = turnP ? esc(turnP.name)+' の番' : '';
  if(myTurn){
    if(v.pending>0) turnText = `+${v.pending} が来た！ ${rules.stack?'ドローカードで返すか、':''}山札から${v.pending}枚引く`;

  app.innerHTML=`<div class="table">

    <div class="arena">
      <div class="seatL">${L.map(seat).join('')}</div>
      <div class="seatT">${T.map(seat).join('')}</div>

        <span class="turn ${myTurn?'mine':''}">${turnText}</span>
        ${selCard?`<button class="act" data-act="playsel">出す（${ui.sel.length}枚）</button><button class="act sub" data-act="unsel">やめる</button>`:''}
        ${myTurn&&v.drawn!=null?'<button class="act" data-act="pass">パス</button>':''}
        ${canUno?'<button class="act uno" data-act="uno">UNO！</button>':(me&&me.calledUno&&v.hand.length<=2?'<span class="act uno said">UNO！</span>':'')}

    app.insertAdjacentHTML('beforeend',`<div class="modal"><div class="box">
      <h2>🎉 ${w?esc(w.name):''} の勝ち！</h2>
      <ul class="score">${ranked.map(p=>`<li><span>${esc(p.name)}</span><span>${p.wins}勝</span></li>`).join('')}</ul>
      ${rulesHTML(isHost)}
      ${isHost?`<button class="btn" data-act="start" ${v.players.filter(p=>p.online).length<2?'disabled':''}>もう一度遊ぶ</button>`:'<p class="hint">ホストが次のゲームを始めるのを待っています…</p>'}
      <button class="btn ghost" data-act="leave">退出する</button>
    </div></div>`);
  }
  layoutHand();
}
function layoutHand(){
  const h=$('.hand'); if(!h) return; const n=h.children.length; if(n<2) return;
  const cw=h.children[0].offsetWidth, avail=h.clientWidth-10, need=n*cw+(n-1)*6;
  h.style.setProperty('--ov', need>avail ? ((avail-n*cw)/(n-1))+'px' : '6px');
}
// fly a card from the player's seat to the pile (play) or from the deck to the seat (draw)
function animateFx(fx){
  const seat = fx.pid===view.you ? $('.hand') : document.querySelector('[data-seat="'+CSS.escape(fx.pid)+'"]');
  if(!seat || !seat.animate) return;
  const sr=seat.getBoundingClientRect(), sx=sr.left+sr.width/2, sy=sr.top+sr.height/2;
  if(fx.kind==='play'){
    const d=$('.discard .card'); if(!d) return;
    const r=d.getBoundingClientRect();
    d.animate([{transform:`translate(${sx-r.left-r.width/2}px,${sy-r.top-r.height/2}px) scale(.5) rotate(-25deg)`,opacity:.5},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.3,1)'});
  }else if(fx.kind==='draw' || fx.kind==='forgot'){
    const d=$('.deck'); if(!d) return;
    const r=d.getBoundingClientRect(), k=Math.min(fx.n||1,5);
    for(let i=0;i<k;i++){
      const g=document.createElement('div'); g.className='flycard'; g.style.left=r.left+'px'; g.style.top=r.top+'px';
      document.body.appendChild(g);
      const an=g.animate([{transform:'none',opacity:1},{transform:`translate(${sx-r.left-r.width/2}px,${sy-r.top-r.height/2}px) scale(.5)`,opacity:.2}],{duration:420,delay:i*90,easing:'ease-in',fill:'both'});
      an.onfinish=an.oncancel=()=>g.remove();
    }
  }
}
function nameOf(pid){ const p=view && view.players.find(x=>x.pid===pid); return p?p.name:''; }
// Meet-style reactions: every press floats up from the right edge, so rapid presses make a stream
function floatEmote(fx){
  const st=$('#stage'); if(!st||!st.animate) return;
  while(st.querySelectorAll('.floatemo').length>=60) st.querySelector('.floatemo').remove();
  const el=document.createElement('div'); el.className='floatemo';
  el.style.right=(8+Math.random()*Math.min(90,innerWidth*.12))+'px'; el.style.bottom='70px';
  el.style.fontSize=(36+Math.random()*22)+'px';
  el.innerHTML=`<span>${esc(fx.text)}</span><small>${esc(nameOf(fx.pid))}</small>`;
  st.appendChild(el);
  const rise=innerHeight*(.45+Math.random()*.3), w=14+Math.random()*24, dir=Math.random()<.5?-1:1;
  const a=el.animate([
    {transform:'translate(0,0) scale(.5)',opacity:0},
    {transform:`translate(${dir*w*.5}px,${-rise*.12}px) scale(1)`,opacity:1,offset:.1},
    {transform:`translate(${-dir*w}px,${-rise*.55}px) scale(1)`,opacity:1,offset:.55},
    {transform:`translate(${dir*w*.5}px,${-rise}px) scale(1.05)`,opacity:0}
  ],{duration:2600+Math.random()*1300,easing:'ease-out'});
  a.onfinish=a.oncancel=()=>el.remove();
}
// played cards shown big in the middle; several cards fan out so you can see how many were played
function bigPlay(fx){
  const st=$('#stage'); if(!st||!st.animate||!fx.cards||!fx.cards.length) return;
  st.querySelectorAll('.bigplay').forEach(e=>e.remove());
  const k=fx.cards.length, el=document.createElement('div'); el.className='bigplay';
  const dot = fx.cards[k-1].c==='w' && fx.col ? `<i class="c-${fx.col}"></i>${COLOR_NAME[fx.col]}を指定　` : '';
  el.innerHTML=`<div class="bp-row">${fx.cards.map(c=>cardHTML(c,'','tabindex="-1" disabled')).join('')}</div>`+
    `<div class="bp-cap">${dot}${esc(nameOf(fx.pid))}：${esc(fx.text)}</div>`;
  st.appendChild(el);
  const cw=el.querySelector('.card').offsetWidth;
  const step=k>1 ? Math.min(cw*.8,(innerWidth-cw-40)/(k-1)) : 0, D=1600;
  [...el.querySelectorAll('.card')].forEach((c,i)=>{
    const m=i-(k-1)/2, rest=`translate(${m*step}px,${Math.abs(m)*6}px) rotate(${m*7}deg)`, stack=`translate(0,0) rotate(${m*1.5}deg)`;
    c.animate([
      {transform:stack+' scale(.35)',opacity:0},
      {transform:stack+' scale(1.06)',opacity:1,offset:.16},
      {transform:stack+' scale(1)',opacity:1,offset:.26},
      {transform:rest+' scale(1)',opacity:1,offset:.46},
      {transform:rest+' scale(1)',opacity:1,offset:.84},
      {transform:rest+' scale(.9)',opacity:0}
    ],{duration:D,easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});
  });
  const a=el.querySelector('.bp-cap').animate([{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.84},{opacity:0}],{duration:D,fill:'both'});
  a.onfinish=a.oncancel=()=>el.remove();
}
function bigUno(fx){ bigBanner('<span class="w"><span>U</span><span>N</span><span>O</span><span>!</span></span><span class="who">'+esc(nameOf(fx.pid))+' がUNO！</span>'); }
function bigForgot(fx){ bigBanner('<span class="w f">忘れん坊！</span><span class="w f">😡🫵</span><span class="who">'+esc(nameOf(fx.pid))+' +2枚</span>'); }
function bigBanner(html){
  const st=$('#stage'); if(!st||!st.animate) return;
  st.querySelectorAll('.biguno').forEach(e=>e.remove());
  const el=document.createElement('div'); el.className='biguno';
  el.innerHTML=html;
  st.appendChild(el);
  const a=el.animate([
    {transform:'translate(-50%,-50%) scale(3.2) rotate(-8deg)',opacity:0},
    {transform:'translate(-50%,-50%) scale(.9) rotate(3deg)',opacity:1,offset:.16},
    {transform:'translate(-50%,-50%) scale(1.08) rotate(-2deg)',offset:.26},
    {transform:'translate(-50%,-50%) scale(1) rotate(0)',offset:.34},
    {transform:'translate(-50%,-50%) scale(1.04) rotate(1deg)',offset:.6},
    {transform:'translate(-50%,-50%) scale(1) rotate(0)',opacity:1,offset:.82},
    {transform:'translate(-50%,-50%) scale(.8)',opacity:0}
  ],{duration:1700,easing:'ease-out'});
  a.onfinish=a.oncancel=()=>el.remove();
}
function playFx(fx){
  if(fx.kind==='emote') floatEmote(fx);
  else if(fx.kind==='play') bigPlay(fx);
  else if(fx.kind==='say' && fx.text==='UNO！') bigUno(fx);
  else if(fx.kind==='forgot') bigForgot(fx);
}
function render(){
  if(ui.screen==='home') renderHome();
  else if(ui.screen==='connecting' || !view) app.innerHTML='<div class="panel"><p class="hint" style="margin:0">接続中…</p></div>';
  else if(view.phase==='lobby') renderLobby();
  else{
    const fx=view.fx, fresh = fx && fx.seq!==lastFx, first=!seenView;
    seenView=true;
    const sig=JSON.stringify({...view,fx:null});
    const emoteOnly = fresh && fx.kind==='emote' && sig===lastSig && $('.table') && !ui.picking;
    const bub = fresh && fx.kind!=='emote' && fx.kind!=='play';
    if(fresh){ lastFx=fx.seq; if(!first) playFx(fx); }
    if(bub){
      ui.bubbles[fx.pid]={...fx,fresh:true};
      clearTimeout(bubTs[fx.pid]);
      bubTs[fx.pid]=setTimeout(()=>{ delete ui.bubbles[fx.pid]; document.querySelectorAll('.bubble[data-pid="'+CSS.escape(fx.pid)+'"]').forEach(b=>b.remove()); },2400);
    }
    // a reaction changes nothing else, so leave the table (and the cards under the player's finger) alone
    if(!emoteOnly) renderTable();
    lastSig=sig;
    if(fresh && !emoteOnly && !first && fx.kind!=='emote') animateFx(fx);
    if(bub) ui.bubbles[fx.pid].fresh=false;
  }
  if(ui.reconnecting && ui.screen==='game') app.insertAdjacentHTML('afterbegin','<div class="banner">ホストとの接続が切れました。再接続中…</div>');
  const mine = !!view && view.phase==='playing' && view.turn===view.you;
  if(mine && !wasMine && navigator.vibrate){ try{ navigator.vibrate(80); }catch{} }
  wasMine=mine;
  document.title = mine ? '▶ あなたの番！ - UNO' : 'オンラインUNO';
}
addEventListener('resize',layoutHand);

/* ================= input ================= */
function readName(){
  const n=($('#name').value||'').trim().slice(0,12);
  if(!n){ ui.error='名前を入力してください。'; render(); return false; }
  myName=n; store.set(localStorage,'uno-name',n); return true;
}
function submitPlay(ids){
  const c=view.hand.find(x=>x.id===ids[0]); if(!c) return;
  if(c.c==='w'){ ui.picking=ids.slice(); render(); return; }
  ui.sel=[]; act({type:'play',ids});
  if(role!=='host') render();
}
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='create'){ if(readName()) createRoom(); }
  else if(a==='join'){
    const c=($('#code').value||'').trim().toUpperCase();
    if(!readName()) return;
    if(!/^[A-Z0-9]{5}$/.test(c)){ ui.error='5文字のルームコードを入力してください。'; render(); return; }
    joinRoom(c);
  }
  else if(a==='copy'){
    const url=location.origin+location.pathname+'?room='+view.code;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(()=>toast('招待リンクをコピーしました'),()=>prompt('このリンクを友達に送ってください',url));
  }
  else if(a==='leave'){ if(view.phase!=='playing' || confirm('ゲームから退出しますか？')){ history.replaceState(null,'',location.pathname); goHome(); } }
  else if(a==='start') act({type:'start'});
  else if(a==='rule') act({type:'rule',key:el.dataset.k,val:el.checked});
  else if(a==='draw'){ ui.sel=[]; act({type:'draw'}); }
  else if(a==='pass') act({type:'pass'});
  else if(a==='emote') act({type:'emote',e:el.dataset.e});
  else if(a==='uno') act({type:'uno'});
  else if(a==='catch') act({type:'catch',target:el.dataset.pid});
  else if(a==='card'){
    const id=+el.dataset.id, c=view.hand.find(x=>x.id===id); if(!c) return;
    if(ui.sel.length){
      if(ui.sel.includes(id)) ui.sel=ui.sel.filter(x=>x!==id);
      else if(el.classList.contains('add')) ui.sel.push(id);
      else return;
      render(); return;
    }
    if(!el.classList.contains('ok')) return;
    const rules=view.rules||DEFAULT_RULES;
    const dup = rules.multi && view.hand.some(x=>x.id!==id && x.v===c.v);
    if(dup){ ui.sel=[id]; render(); } else submitPlay([id]);
  }
  else if(a==='playsel'){ if(ui.sel.length) submitPlay(ui.sel.slice()); }
  else if(a==='unsel'){ ui.sel=[]; render(); }
  else if(a==='color'){ const ids=ui.picking; ui.picking=null; ui.sel=[]; act({type:'play',ids,color:el.dataset.c}); if(role!=='host') render(); }
  else if(a==='unpick'){ if(e.target===el){ ui.picking=null; render(); } }
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter' || ui.screen!=='home') return;
  const b=app.querySelector(e.target.id==='code'||$('#code').value ? '[data-act="join"]' : '[data-act="create"]'); if(b) b.click();
});

/* ================= boot ================= */
(function boot(){
  const urlRoom=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
  let saved=null; try{ saved=JSON.parse(store.get(sessionStorage,'uno-host')||'null'); }catch{}
  if(saved && urlRoom && saved.code===urlRoom && saved.G && saved.G.hostPid===myPid){
    // host reloaded the page: reopen the same room and let guests reconnect
    code=saved.code; G=saved.G;
    G.rules={...DEFAULT_RULES,...(G.rules||{})}; G.pending=G.pending||0;
    for(const p of G.players) p.online = p.pid===myPid;
    ui.screen='connecting'; render(); openHost(true);
  }else if(urlRoom && myName && store.get(sessionStorage,'uno-guest')===urlRoom){
    joinRoom(urlRoom);
  }else render();
})();

})();
</script>
